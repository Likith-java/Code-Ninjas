[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textile-scheduler"
version = "0.1.0"
description = "Standalone production scheduling engine for textile manufacturing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Code Ninjas", email = "team@code-ninjas.example"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "click>=8.1",
]

[project.optional-dependencies]
optimizer = ["ortools>=9.8"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.92",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
docs = ["sphinx>=7.3", "furo>=2024.5"]

[project.entry-points]
console_scripts = {textile-scheduler = "textile_scheduler.cli:main"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["textile_scheduler*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C4", "PTH", "RUF", "RET", "SIM", "TID", "ARG"]
ignore = ["S101", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["unused-ignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "property: Property-based tests",
  "slow: Slow tests",
]

[tool.coverage.run]
source = ["src/textile_scheduler"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
]